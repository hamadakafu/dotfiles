theme = "onedark"

[editor]
auto-completion = true
auto-save = true
bufferline = "always"
color-modes = true
mouse = true
true-color=true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true

[editor.whitespace.render]
space = "all"
tab = "all"
newline = "all"

[editor.whitespace.characters]
space = "·"
nbsp = "⍽"
tab = "→"

[keys.normal]
backspace = "delete_char_backward"
